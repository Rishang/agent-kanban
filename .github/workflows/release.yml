name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.1.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - run: go test ./...

      # Pure Go cross-compile from one runner: tursogo loads its embedded native library
      # with purego, so no cgo or per-OS runners are needed.
      # ponytail: no windows/arm64; turso ships no native lib for it yet. Windows on ARM runs the amd64 build.
      - name: Build
        run: |
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/arm64 windows/amd64; do
            os=${target%/*} arch=${target#*/}
            name=agent-kanban_${TAG#v}_${os}_${arch}
            ext=; [ "$os" = windows ] && ext=.exe
            mkdir "$name"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=$TAG" -o "$name/agent-kanban$ext" ./cmd/agent-kanban
            cp README.md "$name/"
            if [ "$os" = windows ]; then zip -qr "dist/$name.zip" "$name"; else tar -czf "dist/$name.tar.gz" "$name"; fi
          done
          cd dist && sha256sum * > checksums.txt

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --generate-notes --verify-tag
          gh release upload "$TAG" dist/* --clobber
