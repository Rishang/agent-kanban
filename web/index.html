<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Local Kanban</title>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<!-- Libraries from jsDelivr, pinned with SRI: the browser refuses a file whose hash doesn't match. -->
<script src="https://cdn.jsdelivr.net/npm/marked@18.2.0/lib/marked.umd.js" integrity="sha384-DDYDxilZ1LlqPSbaRHlrwh12h+3fUewuQj7HjscrZIWt5bGyQ+n0DHtIoZE3i3zU" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.4.17/dist/purify.min.js" integrity="sha384-P0JNneQf81HOl9VwNXK76cQ9VMD6Nfsnepxb0cCOg8+UzEdzgPHAPV4wVQrvYQSx" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/vue@3.5.45/dist/vue.global.prod.js" integrity="sha384-K2FjvpG1y48yCE+7CBPhnKc16ShPmT3dlNwvoA3dhjV18+L5ugI0P8PWPvdjm/Fa" crossorigin="anonymous"></script>
<style>
:root {
  color-scheme: light dark;
  --bg: light-dark(#f5f3ef, #0c0c0b); --panel: light-dark(#fcfbf8, #121211); --col: light-dark(#edeae4, #171716);
  --card: light-dark(#fefdfa, #1d1c1b); --hover: light-dark(#f1eee8, #252321); --rail: light-dark(#eae6df, #080807);
  --text: light-dark(#1c1a18, #e1dfda); --muted: light-dark(#6e6961, #88847f); --border: light-dark(#e3ded6, #2c2a28);
  --accent-def: light-dark(#5b5bd6, #61afef); --accent: var(--accent-def);
  --accent-soft: light-dark(#ececfd, rgba(97,175,239,.16)); --drop: light-dark(rgba(91,91,214,.10), rgba(97,175,239,.12));
  --shadow: 0 1px 2px light-dark(rgba(16,24,40,.06), rgba(0,0,0,.6)), 0 1px 3px light-dark(rgba(16,24,40,.08), transparent);
  --p-urgent: light-dark(#e5484d, #e06c75); --p-high: light-dark(#f76b15, #d19a66); --p-med: light-dark(#ffb224, #e5c07b);
  --p-low: light-dark(#8b8d98, #5c6370); --ok: light-dark(#30a46c, #98c379);
  --hk: light-dark(#a626a4, #c678dd); --hs: light-dark(#50a14f, #98c379); --hn: light-dark(#986801, #d19a66); --hc: light-dark(#a0a1a7, #7f848e);
  --ht: light-dark(#4078f2, #61afef); --hb: light-dark(#c18401, #e5c07b); --hl: light-dark(#0184bc, #56b6c2); --hv: light-dark(#e45649, #e06c75);
}
:root[data-theme="light"] { color-scheme: light; }
:root[data-theme="dark"] { color-scheme: dark; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 Inter, system-ui, sans-serif; display: flex; overflow: hidden; }
.app { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.rail { width: 52px; flex: none; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 0; background: var(--rail); border-right: 1px solid var(--border); }
.rail button { width: 36px; height: 36px; border: 0; border-radius: 9px; background: none; color: var(--muted); display: grid; place-items: center; cursor: pointer; }
.rail button:hover { background: var(--hover); color: var(--text); }
.rail button.on { background: var(--hover); color: var(--accent); }
.rail .fill { flex: 1; }
main.noside .side { display: none; }
.avatar svg { width: 62%; height: 62%; }
/* projects panel */
/* docked: the sidebar expands and pushes the board, no overlay */
.projects { flex: none; width: 0; overflow: hidden; background: var(--rail); border-right: 0 solid var(--border);
  transition: width .18s ease; display: flex; flex-direction: column; }
.projects.open { width: 272px; border-right-width: 1px; }
.projects > * { min-width: 272px; }
.projects h3 { margin: 0; padding: 14px 16px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); border-bottom: 1px solid var(--border);
  display: flex; justify-content: space-between; align-items: center; }
.plist { flex: 1; overflow-y: auto; padding: 8px; }
.pitem { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 8px; cursor: pointer; }
.pitem:hover { background: var(--hover); }
.pitem.on { background: var(--accent-soft); }
.pitem .pi { width: 28px; height: 28px; border-radius: 7px; display: grid; place-items: center; font-weight: 700; color: #fff; flex: none; font-size: 13px; }
.pitem .pn { flex: 1; min-width: 0; }
.pitem .pn b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
.pitem .pn small { display: block; color: var(--muted); font: 11px 'JetBrains Mono', monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pitem .count { font-size: 11px; color: var(--muted); }
.pitem .pact { display: none; background: none; border: 0; color: var(--muted); cursor: pointer; padding: 3px 6px; border-radius: 6px; font-size: 13px; }
.pitem:hover .pact, .pitem:focus-within .pact { display: block; }
.pitem:hover .count, .pitem:focus-within .count { display: none; }
.pitem .pact:hover { color: var(--text); background: var(--hover); }
.pitem .pact.del:hover { color: var(--p-urgent); }
#boardName { cursor: text; border-radius: 6px; padding: 1px 4px; }
#boardName:hover { background: var(--hover); }
.brand input, .pitem .pn input { width: 100%; font: 600 13px Inter, sans-serif; color: var(--text); background: var(--bg); border: 1px solid var(--accent); border-radius: 6px; padding: 3px 6px; outline: none; }
.padd { padding: 12px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; }
.padd .inp { max-width: none; }
.brand:hover { background: var(--hover); }
/* command palette */
.palette { position: fixed; inset: 0; z-index: 25; display: none; align-items: flex-start; justify-content: center; padding-top: 11vh; background: rgba(10,12,16,.38); }
.palette.open { display: flex; }
.pal { width: min(720px, 94vw); background: var(--panel); border: 1px solid var(--border); border-radius: 14px; box-shadow: 0 24px 60px rgba(0,0,0,.35);
  overflow: hidden; display: flex; flex-direction: column; max-height: 72vh; }
.palbar { display: flex; align-items: center; gap: 10px; padding: 0 16px; border-bottom: 1px solid var(--border); color: var(--muted); }
.palbar input { flex: 1; border: 0; outline: none; background: none; padding: 16px 0; font-size: 16px; color: var(--text); }
.presults { overflow-y: auto; padding: 6px; }
.pgroup { padding: 10px 12px 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.pres { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; padding: 8px 12px; border-radius: 8px; cursor: pointer; }
.pres.on { background: var(--accent-soft); }
.pres .pid { font: 11.5px 'JetBrains Mono', monospace; color: var(--muted); }
.pres .pt { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pres .pm { display: flex; gap: 6px; align-items: center; font-size: 11px; color: var(--muted); white-space: nowrap; }
.pres .ps { grid-column: 2 / 4; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pres .ps i { font-style: normal; opacity: .75; }
mark { background: color-mix(in srgb, var(--p-med) 38%, transparent); color: inherit; border-radius: 3px; padding: 0 1px; }
.pempty { padding: 28px; text-align: center; color: var(--muted); }
.pfoot { padding: 8px 14px; border-top: 1px solid var(--border); font-size: 11.5px; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.pfoot button { background: var(--col); border: 1px solid var(--border); border-radius: 6px; padding: 1px 7px; font: 11px 'JetBrains Mono', monospace; color: var(--muted); cursor: pointer; }
.pfoot button:hover { color: var(--text); border-color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Top bar */
header { display: flex; align-items: center; gap: 10px; padding: 10px 20px; background: var(--panel); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.brand { font-weight: 700; display: flex; align-items: center; gap: 8px; cursor: pointer; border-radius: 8px; padding: 2px 6px 2px 2px; }
.brand .logo { width: 24px; height: 24px; display: block; }
.sync { display: flex; align-items: center; gap: 6px; font: 12px 'JetBrains Mono', monospace; color: var(--muted); background: var(--col); padding: 4px 10px; border-radius: 999px; max-width: 340px; min-width: 0; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); animation: pulse 2s infinite; }
@keyframes pulse { 70% { box-shadow: 0 0 0 6px rgba(48,164,108,0); } 0% { box-shadow: 0 0 0 0 rgba(48,164,108,.6); } }
.spacer { flex: 1; }
.search { background: var(--col); border: 1px solid transparent; border-radius: 8px; padding: 6px 10px; width: 220px; outline: none; }
.search:focus { border-color: var(--accent); }
.ctl { background: var(--col); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; cursor: pointer; }
.ctl:hover { border-color: var(--accent); }
.btn { background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 7px 12px; font-weight: 600; cursor: pointer; }
.icon-btn { background: none; border: 0; color: var(--muted); cursor: pointer; padding: 4px 6px; border-radius: 6px; }
.icon-btn:hover { background: var(--hover); color: var(--text); }
.d-top .icon-btn { width: 34px; height: 34px; padding: 0; display: grid; place-items: center; font: 18px/1 Inter, system-ui, sans-serif; border-radius: 8px; }
.row-i .icon-btn, .check .icon-btn { min-width: 30px; height: 30px; font-size: 15px; }

.toast { position: fixed; bottom: 22px; left: 50%; transform: translate(-50%, 20px); background: var(--p-urgent); color: #fff; padding: 10px 16px; border-radius: 10px;
  box-shadow: 0 8px 24px rgba(0,0,0,.3); z-index: 30; max-width: min(640px, 92vw); opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.dot.off { background: var(--p-urgent); animation: none; }
.feed li.link { cursor: pointer; border-radius: 8px; }
.feed li.link:hover { background: var(--hover); }
.mcp .agent .st { width: 9px; height: 9px; border-radius: 50%; background: var(--p-urgent); flex: none; }
.mcp .agent .st.on { background: var(--ok); }
.hrow { display: flex; align-items: center; gap: 10px; padding: 6px 0; }
.prop input.toggle { width: 34px; padding: 0; margin: 0; border: 0; background: var(--border); }
.prop input.toggle:checked { background: var(--accent); }
#dbName { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hrow small { color: var(--muted); font-size: 12px; }
.linkrow { display: flex; align-items: center; gap: 4px; }
.linkrow input { flex: 1; min-width: 0; }
.linkrow a { color: var(--accent); text-decoration: none; font-size: 16px; padding: 4px 6px; border-radius: 6px; }
.linkrow a:hover { background: var(--hover); }
.card .human { color: var(--p-med); }
.kbd { font: 11px 'JetBrains Mono', monospace; border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; color: var(--muted); }

/* Layout */
main { flex: 1; display: flex; min-height: 0; }
.board { flex: 1; display: flex; gap: 12px; padding: 16px 20px; overflow-x: auto; min-width: 0; }
.column { flex: 1 1 0; min-width: 250px; background: var(--col); border-radius: 12px; display: flex; flex-direction: column; min-height: 0; }
.col-head { display: flex; align-items: center; gap: 8px; padding: 12px 14px 8px; font-weight: 600; }
.col-head .count { color: var(--muted); font-weight: 500; font-size: 12px; background: var(--panel); padding: 1px 7px; border-radius: 999px; }
.col-head .wip { margin-left: auto; font-size: 11px; color: var(--muted); }
.col-head .wip.over { color: var(--p-urgent); font-weight: 600; }
.swatch { width: 9px; height: 9px; border-radius: 3px; }
.cards { flex: 1; padding: 4px 10px 10px; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; border-radius: 10px; transition: background .15s; }
.cards.over { background: var(--drop); outline: 2px dashed var(--accent); outline-offset: -4px; }
.empty { color: var(--muted); font-size: 12px; text-align: center; padding: 18px 0; border: 1px dashed var(--border); border-radius: 10px; }

/* Card */
.card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; box-shadow: var(--shadow); cursor: pointer; transition: transform .12s, border-color .12s; }
.card:hover { border-color: var(--accent); transform: translateY(-1px); }
.card.sel { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.card.dragging { opacity: .4; }
.card.flash { animation: flash 1.4s; }
@keyframes flash { 0% { box-shadow: 0 0 0 3px var(--accent); } 100% { box-shadow: var(--shadow); } }
.card .id { font: 11px 'JetBrains Mono', monospace; color: var(--muted); display: flex; justify-content: space-between; }
.card .title { font-weight: 500; margin: 4px 0 8px; }
.meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 11px; color: var(--muted); }
.meta .avatar { margin-left: auto; }
.tag { background: color-mix(in srgb, var(--lc, var(--accent)) 18%, transparent); color: var(--lc, var(--accent)); padding: 1px 7px; border-radius: 999px; font-weight: 500; }
.prio { display: inline-flex; align-items: center; gap: 4px; }
.prio i { width: 7px; height: 7px; border-radius: 2px; display: inline-block; }
.avatar { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 10px; font-weight: 700; color: #fff; flex: none; }
.progress { height: 3px; background: var(--col); border-radius: 2px; margin-top: 8px; overflow: hidden; }
.quick { margin: 0 10px 10px; }
.quick button { width: 100%; padding: 7px 10px; border: 0; border-radius: 8px; background: none; color: var(--muted); cursor: pointer; text-align: left; }
.quick button:hover { background: var(--hover); color: var(--text); }
.quick input { width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--accent); background: var(--card); outline: none; }

/* Side panel (activity / mcp) */
.side { width: 320px; flex: none; border-left: 1px solid var(--border); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
.tabs { display: flex; border-bottom: 1px solid var(--border); }
.tabs button { flex: 1; background: none; border: 0; padding: 11px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; font-weight: 500; }
.tabs button.on { color: var(--text); border-color: var(--accent); }
.pane { flex: 1; overflow-y: auto; padding: 14px; display: none; }
.pane.on { display: block; }
.feed { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.feed li { display: flex; gap: 10px; font-size: 13px; }
.feed small { display: block; color: var(--muted); font-size: 11px; }
.seg.feedmode { display: flex; width: 100%; margin-bottom: 14px; padding: 3px; border-radius: 9px; background: var(--bg); }
.seg.feedmode button { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 6px 8px; font-size: 12.5px; border-radius: 6px; }
.seg.feedmode button svg { width: 14px; height: 14px; }
.seg.feedmode button.on { background: var(--accent-soft); color: var(--accent); box-shadow: none; }
/* activity grouped by task */
.feed li.tgroup { flex-direction: column; gap: 8px; }
.tg-head { display: flex; align-items: center; gap: 8px; font-size: 13px; min-width: 0; }
.tg-head .caret { background: none; border: 0; color: var(--muted); cursor: pointer; padding: 0; width: 16px; transition: transform .15s; flex: none; }
.tgroup.closed .caret { transform: rotate(-90deg); }
.tg-head .tt { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
.tg-head .tt[data-open] { cursor: pointer; }
.tg-head .tt[data-open]:hover { color: var(--accent); }
.tg-head small { display: inline; flex: none; }
.tg-kids { margin-left: 7px; padding-left: 14px; border-left: 2px solid var(--border); display: flex; flex-direction: column; gap: 8px; }
.tgroup.closed .tg-kids { display: none; }
.tg-kids .row { display: flex; gap: 8px; align-items: flex-start; font-size: 12.5px; }
.tg-kids .avatar { width: 18px; height: 18px; margin: 1px 0 0; }
.tg-kids .x { color: var(--muted); font-size: 11px; margin-left: 4px; }
code { font: 12px 'JetBrains Mono', monospace; background: var(--col); padding: 0 4px; border-radius: 4px; }
.mcp h4 { margin: 0 0 8px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.mcp .tool { font: 12px 'JetBrains Mono', monospace; padding: 6px 8px; background: var(--col); border-radius: 6px; margin-bottom: 6px; }
.mcp .agent { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--border); }
.mcp .agent span:last-child { margin-left: auto; font-size: 11px; color: var(--ok); }

/* Task drawer: wide reading view, content left / properties right */
.scrim { position: fixed; inset: 0; background: rgba(10,12,16,.3); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 9; }
.scrim.show { opacity: 1; pointer-events: auto; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(880px, 100vw); max-width: 100vw; background: var(--panel); border-left: 1px solid var(--border);
  box-shadow: -12px 0 40px rgba(0,0,0,.22); transform: translateX(100%); transition: transform .22s ease, width .22s ease; z-index: 10; display: flex; flex-direction: column; }
.drawer.open { transform: none; }
.drawer.resizing { transition: none; user-select: none; }
.resize { position: absolute; left: -5px; top: 0; bottom: 0; width: 10px; cursor: ew-resize; z-index: 2; touch-action: none; }
.resize::after { content: ''; position: absolute; left: 4px; top: 50%; width: 3px; height: 44px; margin-top: -22px; border-radius: 3px; background: var(--border); transition: background .15s, height .15s, margin .15s; }
.resize:hover::after, .resizing .resize::after { background: var(--accent); height: 96px; margin-top: -48px; }
.d-top { display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-bottom: 1px solid var(--border); font: 12px 'JetBrains Mono', monospace; color: var(--muted); }
.d-top .live { color: var(--accent); font-family: Inter, sans-serif; opacity: 0; transition: opacity .3s; }
.d-top .live.show { opacity: 1; }
.d-body { flex: 1; overflow-y: auto; display: grid; grid-template-columns: minmax(0, 1fr) 250px; }
.d-main { padding: 28px 36px 48px; min-width: 0; }
.d-side { padding: 24px 18px; border-left: 1px solid var(--border); background: var(--bg); }
.d-title { width: 100%; border: 0; background: none; font-size: 26px; font-weight: 700; letter-spacing: -.01em; resize: none; outline: none; padding: 4px 8px; margin: 0 -8px 6px; border-radius: 8px; line-height: 1.25; overflow: hidden; }
.d-title:hover, .d-title:focus { background: var(--hover); }
.d-sub { color: var(--muted); font-size: 13px; margin-bottom: 8px; }
.props { display: flex; flex-direction: column; gap: 16px; }
.prop > span { display: block; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 4px; }
.prop select, .prop input { width: 100%; border: 1px solid transparent; background: none; padding: 6px 8px; margin-left: -8px; border-radius: 6px; cursor: pointer; outline: none; }
.prop select:hover, .prop input:hover, .prop select:focus, .prop input:focus { background: var(--hover); border-color: var(--border); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chips .tag button { background: none; border: 0; color: inherit; cursor: pointer; padding: 0 0 0 3px; opacity: .6; }
.chips input { width: auto !important; flex: 1; min-width: 80px; font-size: 12px; }
.d-sec { margin-top: 30px; }
.d-sec h4 { margin: 0 0 10px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.d-sec h4 .icon-btn { margin-left: auto; text-transform: none; letter-spacing: 0; font-size: 12px; }
.d-desc { width: 100%; min-height: 240px; border: 1px solid var(--accent); background: var(--panel); border-radius: 8px; padding: 12px 14px; resize: vertical; outline: none;
  font: 13.5px/1.65 'JetBrains Mono', monospace; }
.hint { color: var(--muted); font-size: 12px; margin-top: 6px; }
.desc-view { padding: 10px 14px; margin: 0 -14px; border-radius: 8px; cursor: text; border: 1px solid transparent; }
.desc-view:hover { background: var(--hover); }
.ph { color: var(--muted); font-style: italic; }

/* Markdown prose */
.md { font-size: 15px; line-height: 1.7; overflow-wrap: anywhere; max-width: 78ch; }
.md > :first-child { margin-top: 0; } .md > :last-child { margin-bottom: 0; }
.md h1, .md h2, .md h3, .md h4 { line-height: 1.3; margin: 1.3em 0 .5em; }
.md h1 { font-size: 21px; } .md h2 { font-size: 18px; } .md h3 { font-size: 16px; } .md h4 { font-size: 15px; }
.md p, .md ul, .md ol, .md pre, .md table, .md blockquote { margin: 0 0 .9em; }
.md ul, .md ol { padding-left: 1.5em; }
.md li { margin: .25em 0; }
.md li:has(> input[type=checkbox]) { list-style: none; margin-left: -1.3em; }
.md input[type=checkbox] { accent-color: var(--accent); margin-right: 6px; }
.md code { font-size: .86em; }
.md :not(pre) > code { background: var(--col); border: 1px solid var(--border); border-radius: 5px; padding: .5px 5px; white-space: break-spaces; }
/* comments: narrower column, so tighter type than descriptions */
.comment .md { font-size: 14px; line-height: 1.55; }
.comment .md p, .comment .md ul, .comment .md ol, .comment .md pre { margin-bottom: .6em; }
.comment .md ul, .comment .md ol { padding-left: 1.25em; }
.comment .md li { margin: .1em 0; }
.comment .md li::marker { color: var(--muted); }
.md pre { background: var(--col); padding: 12px 14px; border-radius: 8px; overflow-x: auto; border: 1px solid var(--border); }
.md pre code { background: none; padding: 0; font-size: 13px; line-height: 1.6; tab-size: 4; }
/* highlight.js tokens */
.hljs-keyword, .hljs-selector-tag, .hljs-doctag { color: var(--hk); }
.hljs-string, .hljs-regexp, .hljs-addition, .hljs-attribute, .hljs-meta .hljs-string { color: var(--hs); }
.hljs-number, .hljs-attr, .hljs-selector-attr, .hljs-selector-class { color: var(--hn); }
.hljs-comment, .hljs-quote { color: var(--hc); font-style: italic; }
.hljs-title, .hljs-title.function_, .hljs-function .hljs-title, .hljs-section { color: var(--ht); }
.hljs-built_in, .hljs-type, .hljs-class .hljs-title, .hljs-title.class_ { color: var(--hb); }
.hljs-literal, .hljs-meta, .hljs-symbol, .hljs-link { color: var(--hl); }
.hljs-variable, .hljs-template-variable, .hljs-name, .hljs-tag, .hljs-deletion, .hljs-subst { color: var(--hv); }
.hljs-emphasis { font-style: italic; } .hljs-strong { font-weight: 700; }
.md blockquote { padding: 2px 14px; border-left: 3px solid var(--accent); color: var(--muted); }
.md table { border-collapse: collapse; font-size: 14px; display: block; overflow-x: auto; }
.md th, .md td { border: 1px solid var(--border); padding: 6px 12px; text-align: left; }
.md th { background: var(--col); font-weight: 600; }
.md a { color: var(--accent); }
.md hr { border: 0; border-top: 1px solid var(--border); margin: 1.4em 0; }
.md img { max-width: 100%; border-radius: 8px; }
.md .svgview { background: var(--col); border: 1px solid var(--border); border-radius: 8px; padding: 14px; margin: 0 0 .9em; text-align: center; }
.md .svgview img { max-height: 480px; border-radius: 0; }
.md > svg, .md p > svg { max-width: 100%; height: auto; }
.md .mermaid { background: var(--col); border: 1px solid var(--border); border-radius: 8px; padding: 14px; margin: 0 0 .9em; overflow-x: auto; text-align: center; }
.md .mermaid svg { max-width: 100%; height: auto; }
.md .mermaid.mermaid-err { text-align: left; white-space: pre-wrap; font: 13px/1.6 'JetBrains Mono', monospace; color: var(--muted); border-color: var(--p-urgent); }

.check { display: flex; align-items: center; gap: 10px; padding: 6px 8px; margin: 0 -8px; border-radius: 6px; font-size: 15px; }
.check:hover { background: var(--hover); }
.check input[type=checkbox] { accent-color: var(--accent); width: 16px; height: 16px; }
.check.done span { text-decoration: line-through; color: var(--muted); }
.check .icon-btn { margin-left: auto; visibility: hidden; }
.check:hover .icon-btn { visibility: visible; }
.bar { height: 4px; background: var(--col); border-radius: 2px; overflow: hidden; flex: 1; max-width: 160px; }
.progress span, .bar span { display: block; height: 100%; background: var(--ok); }
.add-line { width: 100%; border: 0; background: none; padding: 6px 0; outline: none; color: var(--muted); font-size: 14px; }
.add-line:focus { color: var(--text); }
.comment { display: flex; gap: 12px; margin-bottom: 14px; }
.comment .avatar { margin: 2px 0 0; width: 28px; height: 28px; font-size: 11px; }
.bubble { flex: 1; min-width: 0; background: var(--col); border-radius: 10px; padding: 10px 14px; }
.bubble .who { font-size: 13px; margin-bottom: 4px; }
.bubble .who small { color: var(--muted); font-size: 12px; margin-left: 6px; }
.bubble .md { font-size: 14px; line-height: 1.6; }
.compose { margin-top: 8px; }
.compose textarea { width: 100%; min-height: 76px; background: var(--col); border: 1px solid transparent; border-radius: 10px; padding: 10px 12px; outline: none; resize: vertical; line-height: 1.5; }
.compose textarea:focus { border-color: var(--accent); background: var(--panel); }
.compose .row { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; }
.d-foot { padding: 10px 16px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--muted); }
.danger { color: var(--p-urgent); }

/* Settings */
.s-body { flex: 1; display: grid; grid-template-columns: 190px minmax(0, 1fr); min-height: 0; }
.s-nav { padding: 16px 10px; border-right: 1px solid var(--border); background: var(--bg); display: flex; flex-direction: column; gap: 2px; }
.s-nav button { text-align: left; background: none; border: 0; padding: 8px 10px; border-radius: 6px; color: var(--muted); font-weight: 500; cursor: pointer; white-space: nowrap; }
.s-nav button:hover, .s-nav button.on { background: var(--hover); color: var(--text); }
.s-main { overflow-y: auto; padding: 26px 34px 80px; }
.s-sec { margin-bottom: 40px; scroll-margin-top: 16px; }
.s-sec h3 { margin: 0 0 4px; font-size: 17px; }
.s-sec > p { margin: 0 0 14px; color: var(--muted); font-size: 13px; }
.field { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--border); }
.field > span { font-weight: 500; }
.field small { display: block; color: var(--muted); font-weight: 400; font-size: 12px; }
.inp { background: var(--col); border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px; outline: none; width: 100%; max-width: 320px; }
.inp:focus { border-color: var(--accent); }
.list { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.row-i { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-top: 1px solid var(--border); }
.row-i:first-child { border-top: 0; }
.row-i input[type=color] { width: 26px; height: 26px; border: 0; padding: 0; background: none; cursor: pointer; flex: none; }
.row-i .grow { flex: 1; min-width: 0; max-width: none; }
.row-i .num { width: 76px; flex: none; }
.row-i .muted { color: var(--muted); font-size: 12px; white-space: nowrap; }
.icon-btn:disabled { opacity: .3; cursor: not-allowed; }
.snippet { position: relative; margin-bottom: 14px; }
.snippet > div { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.snippet pre { background: var(--col); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; font: 12.5px/1.6 'JetBrains Mono', monospace; overflow-x: auto; margin: 0; }
.snippet button { position: absolute; top: 26px; right: 8px; }
.btn.ghost { background: var(--col); color: var(--text); border: 1px solid var(--border); font-weight: 500; }
.btn.red { background: var(--p-urgent); }
.danger-zone { border: 1px solid var(--p-urgent); border-radius: 10px; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 16px; }
.danger-zone small { display: block; color: var(--muted); }
#settings { width: min(920px, 100vw); }
.seg { display: inline-flex; background: var(--col); border: 1px solid var(--border); border-radius: 9px; padding: 3px; width: fit-content; }
.seg button { background: none; border: 0; padding: 6px 14px; border-radius: 6px; cursor: pointer; color: var(--muted); font-weight: 500; }
.seg button.on { background: var(--panel); color: var(--text); box-shadow: var(--shadow); }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; }
.swatches button { width: 28px; height: 28px; border-radius: 50%; border: 0; cursor: pointer; display: grid; place-items: center; color: #fff;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.12); transition: transform .12s; }
.swatches button:hover { transform: scale(1.12); }
.swatches button.on { box-shadow: 0 0 0 2px var(--panel), 0 0 0 4px var(--text); }
.swatches button.on::after { content: '✓'; font-size: 14px; font-weight: 700; }
.toggle { appearance: none; width: 34px; height: 20px; border-radius: 999px; background: var(--border); position: relative; cursor: pointer; transition: background .15s; flex: none; margin: 0; }
.toggle::after { content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .15s; }
.toggle:checked { background: var(--accent); }
.toggle:checked::after { transform: translateX(14px); }
@media (max-width: 760px) {
  .d-body { grid-template-columns: 1fr; }
  .d-side { order: -1; border-left: 0; border-bottom: 1px solid var(--border); }
  .props { display: grid; grid-template-columns: 1fr 1fr; }
  .d-main { padding: 20px 18px 40px; }
  .s-body { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
  .s-nav { flex-direction: row; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--border); padding: 8px; }
  .s-main { padding: 20px 16px 60px; }
  .field { grid-template-columns: 1fr; gap: 6px; }
  .row-i { flex-wrap: wrap; }
}

@media (max-width: 1100px) { .side { display: none; } }
@media (max-width: 700px) { .search { width: 100%; order: 10; } .board { padding: 12px; } }
</style>

<aside class="projects" id="projects" aria-label="Projects"><div id="projApp" style="display:contents"></div></aside>
<script type="text/x-template" id="tpl-projects">
  <h3>Projects <button class="icon-btn" aria-label="Close" @click="toggleProjects(false)">✕</button></h3>
  <div class="plist">
    <div v-for="p in S.projects" :key="p.id" class="pitem" :class="{ on: p.id === S.proj }" :title="p.dir || p.id" @click="renaming === p.id || switchProject(p.id)">
      <span class="pi" :style="{ background: projColor(p.id) }">{{ p.name.slice(0, 1).toUpperCase() }}</span>
      <span class="pn"><input v-if="renaming === p.id" ref="renameEl" v-model="newName" maxlength="64" aria-label="Project name"
          @click.stop @keydown.enter.stop="saveRename(p)" @keydown.esc.stop="renaming = null" @blur="saveRename(p)"><b v-else>{{ p.name }}</b>
        <small>{{ p.dir || p.id }}</small></span>
      <button class="pact" title="Rename project" :aria-label="'Rename ' + p.name" @click.stop="startRename(p)">✎</button>
      <button class="pact del" title="Delete project" :aria-label="'Delete ' + p.name" @click.stop="deleteProject(p.id)">🗑</button>
      <span class="count" title="open / total tasks">{{ p.open }}/{{ p.total }}</span></div>
    <p v-if="!S.projects.length" class="ph" style="padding:10px">No projects.</p>
  </div>
  <div class="padd">
    <input class="inp" ref="nameEl" v-model="name" placeholder="New project name" @keydown.enter="add">
    <input class="inp" v-model="dir" placeholder="Folder (optional), e.g. ~/code/app" @keydown.enter="add">
    <button class="btn" @click="add">+ Add project</button>
    <span class="hint" style="margin:0">Or run <code>agent-kanban</code> inside a repo.</span>

<div class="palette" id="palette" role="dialog" aria-label="Search every project"><div id="palApp" style="display:contents"></div></div>
<script type="text/x-template" id="tpl-palette">
  <div class="pal">
    <div class="palbar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input ref="inEl" v-model="q" placeholder="Search every project…  try is:open @claude label:bug" autocomplete="off" spellcheck="false" @input="soon" @keydown="onKey"><span class="kbd">esc</span></div>
    <div class="presults" ref="resEl">
      <template v-for="(it, i) in items" :key="i">
        <div v-if="group(i)" class="pgroup">{{ group(i) }}</div>
        <div class="pres" :class="{ on: i === sel }" @mousemove="sel = i" @click="choose(i)">
          <template v-if="it.project"><span class="pid">project</span><span class="pt" v-html="hl(it.project.name, words)"></span><span class="pm">{{ it.project.open }} open · {{ it.project.total }} total</span></template>
          <template v-else>
            <span class="pid" v-html="hl(it.hit.id, words)"></span>
            <span class="pt">{{ it.hit.human ? '👤 ' : '' }}<span v-html="hl(it.hit.title, words)"></span></span>
            <span class="pm"><span class="tag" :style="{ '--lc': projColor(it.hit.project) }">{{ it.hit.projectName }}</span><span>{{ it.hit.columnName }}</span>
              <span class="prio"><i :style="{ background: PRIO_COLOR[it.hit.priority] }"></i></span><span v-if="it.hit.assignee" style="display:contents" v-html="av(it.hit.assignee)"></span></span>
            <span v-if="it.hit.snippet" class="ps"><i>{{ it.hit.where }}:</i> <span v-html="hl(it.hit.snippet, words)"></span></span>
          </template>
        </div>
      </template>
      <div v-if="!items.length" class="pempty">No matches{{ q.trim() ? ` for “${q.trim()}”` : '' }}. Try fewer words or a filter like <code>is:open</code>.</div>
    </div>
    <div class="pfoot"><span><span class="kbd">↑↓</span> move · <span class="kbd">↵</span> open · filters:</span>
      <button v-for="f in FILTERS" :key="f" @click="insert(f)">{{ f === '@' ? '@who' : f }}</button></div>

</script>

<!-- Board (Vue): columns, cards, drag and drop, quick add. -->
<script type="text/x-template" id="tpl-board">
  <div class="column" v-for="c in S.B.columns" :key="c.id">
    <div class="col-head"><span class="swatch" :style="{ background: c.color }"></span>{{ c.name }}
      <span class="count">{{ total(c.id) }}</span>
      <span v-if="c.wip" class="wip" :class="{ over: total(c.id) > c.wip }">WIP {{ total(c.id) }}/{{ c.wip }}</span></div>
    <div class="cards" :data-col="c.id" :class="{ over: overCol === c.id }" @dragover="onOver($event, c.id)" @drop="onDrop($event, c.id)">
      <article v-for="t in lists[c.id]" :key="t.id" class="card" :data-id="t.id" tabindex="0" draggable="true"
        :class="{ sel: t.id === S.openId, dragging: t.id === dragId, flash: t.id === S.flashId }"
        @dragstart="dragId = t.id" @dragend="dragId = overCol = null">
        <div class="id"><span>{{ t.id }}</span><span v-if="t.human" class="human" title="Human-only: agents skip it">👤 human</span><span v-else-if="member(t.assignee)?.agent" title="Agent-managed">⚡ agent</span></div>
        <div class="title">{{ t.title }}</div>
        <div class="meta">
          <span class="prio"><i :style="{ background: PRIO_COLOR[t.priority] }"></i>{{ t.priority }}</span>
          <span v-for="l in t.labels" :key="l" class="tag" :style="{ '--lc': labelColor(l) }">{{ l }}</span>
          <span v-if="t.due" :style="overdue(t) ? 'color:var(--p-urgent)' : ''">📅 {{ t.due.slice(5) }}</span>
          <span v-if="t.checklist.length">☑ {{ done(t) }}/{{ t.checklist.length }}</span>
          <span v-if="t.comments.length">💬 {{ t.comments.length }}</span>
          <span v-if="t.link" title="Has a link">🔗</span>
          <span v-if="t.assignee" style="display:contents" v-html="av(t.assignee)"></span>
        </div>
        <div v-if="t.checklist.length" class="progress"><span :style="{ width: done(t) / t.checklist.length * 100 + '%' }"></span></div>
      </article>
      <div v-if="!lists[c.id].length" class="empty">Drop tasks here</div>
    </div>
    <div class="quick" :data-col="c.id">
      <input v-if="quickCol === c.id" :ref="el => quickEl = el" v-model="quickText" placeholder="Task title, Enter to add · Esc to cancel"
        @keydown.enter="addQuick(c.id)" @keydown.esc.stop="quickCol = null" @blur="quickText.trim() || (quickCol = null)">
      <button v-else @click="openQuick(c.id)">+ Add task</button>
    </div>
  </div>
</script>
  <aside class="side"><div id="sideApp" style="display:contents"></div></aside>
<script type="text/x-template" id="tpl-side">

      <button :class="{ on: mode === 'task' }" role="tab" @click="setMode('task')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4v16M5 8h6M5 16h6"/><rect x="13" y="5" width="7" height="6" rx="1.5"/><rect x="13" y="13" width="7" height="6" rx="1.5"/></svg>By task</button></div>
    <ul class="feed">

      <template v-else>

<script>
// The UI libraries come from jsDelivr: say so instead of showing a dead page when they can't load (offline, blocked).
if (!window.Vue || !window.marked || !window.DOMPurify) {
  document.body.innerHTML = '<p style="padding:24px;font:15px sans-serif">Couldn’t load the UI libraries from cdn.jsdelivr.net. The board needs internet access in this browser: check the connection and reload.</p>';
  throw new Error('UI libraries failed to load');
}
// ---------- State (from GET /api/board, refreshed on every SSE event) ----------
// All UI state. S.B is the board from GET /api/board, replaced on every SSE event.
const S = Vue.reactive({ B: { settings: { perms: {} }, columns: [], members: [], labels: [], priorities: [], tasks: [], events: [], seen: {}, db: '' }, openId: null, saved: '', live: false, q: '', who: '', sort: 'order', flashId: null,
  projects: [], proj: null, pal: { q: '', n: 0 }, settingsN: 0 });
const members = Vue.computed(() => Object.fromEntries(S.B.members.map(m => [m.name, m])));
const labels = Vue.computed(() => Object.fromEntries(S.B.labels.map(l => [l.name, l.color])));
const member = name => members.value[name], labelColor = name => labels.value[name];
const PRIO = { urgent: 0, high: 1, medium: 2, low: 3 };
const PRIO_COLOR = { urgent: 'var(--p-urgent)', high: 'var(--p-high)', medium: 'var(--p-med)', low: 'var(--p-low)' };
// One family (Tailwind 500s): equal weight, readable as text on dark and as button fill with white text.
const ACCENTS = [['Blue', '#3b82f6'], ['Indigo', '#6366f1'], ['Violet', '#8b5cf6'], ['Pink', '#ec4899'], ['Rose', '#f43f5e'],
  ['Orange', '#f97316'], ['Amber', '#f59e0b'], ['Emerald', '#10b981'], ['Teal', '#14b8a6'], ['Sky', '#0ea5e9'], ['Grey', '#71717a']];
const PERMS = { create: 'Create tasks', edit: 'Edit fields & checklists', move: 'Move between columns', finish: 'Move to the last column (Done)', comment: 'Comment', delete: 'Delete tasks' };

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ago = t => { const s = (Date.now() - t) / 1000; return s < 60 ? 'just now' : s < 3600 ? `${s / 60 | 0}m ago` : s < 86400 ? `${s / 3600 | 0}h ago` : `${s / 86400 | 0}d ago`; };
const byId = id => S.B.tasks.find(t => t.id === id);
const colName = id => S.B.columns.find(c => c.id === id)?.name ?? id;
const lastCol = () => S.B.columns.at(-1)?.id;
const ME = () => S.B.settings.me;
const randColor = () => '#' + (Math.random() * 0xffffff | 0).toString(16).padStart(6, '0');
// Generic glyphs (not brand logos) for members; Member.icon overrides the name-based default.
const GLYPH = {
  user: '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
  bot: '<rect x="4" y="8" width="16" height="12" rx="3"/><path d="M12 4v4M9 13v1M15 13v1"/>',
  claude: '<path d="M12 3v18M3 12h18M5.6 5.6l12.8 12.8M18.4 5.6 5.6 18.4"/>',
  codex: '<path d="m5 8 4 4-4 4M12 17h7"/>',
  pi: '<path d="M4 7h16M9 7v12M15 7v9a3 3 0 0 0 3 3"/>',
  opencode: '<path d="m8 6-6 6 6 6M16 6l6 6-6 6"/>',
  gemini: '<path d="M12 3c.6 4.8 4.2 8.4 9 9-4.8.6-8.4 4.2-9 9-.6-4.8-4.2-8.4-9-9 4.8-.6 8.4-4.2 9-9z"/>',
  cursor: '<path d="m5 3 6 17 2.5-7.5L21 10z"/>',
  copilot: '<circle cx="8" cy="13" r="3"/><circle cx="16" cy="13" r="3"/><path d="M11 13h2M4 10l2-4h12l2 4"/>',
};
const AUTO_ICON = { claude: 'claude', codex: 'codex', pi: 'pi', opencode: 'opencode', gemini: 'gemini', cursor: 'cursor', copilot: 'copilot' };
const iconOf = (name, m) => (m?.icon && GLYPH[m.icon] ? m.icon : AUTO_ICON[name]) || (m?.agent ? 'bot' : 'user');
const av = who => { const p = member(who) || { color: '#7f848e' };
  return `<span class="avatar" style="background:${esc(p.color)}" title="${esc(who)}"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${GLYPH[iconOf(who, p)]}</svg></span>`; };
const archived = t => S.B.settings.archiveDays > 0 && t.column === lastCol() && Date.now() - t.updated > S.B.settings.archiveDays * 864e5;
const store = { get: k => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} } };

function toast(msg) {
  const el = $('#toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('show'), 5000);
}

// ---------- Server ----------
async function post(url, body) {
  const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body ?? {}) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { toast(j.error || r.statusText); throw new Error(j.error || r.statusText); }
  return j;
}
async function api(op, body) {
  const r = await fetch('/api/p/' + encodeURIComponent(S.proj) + '/' + op, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body ?? {}) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { toast(j.error || r.statusText); throw new Error(j.error || r.statusText); }
  S.saved = 'Saved · ' + new Date().toLocaleTimeString();
  return j;
}

let reqSeq = 0, applied = 0, flashEv = null, routed = false;
async function load() {
  const my = ++reqSeq;
  const r = await fetch('/api/p/' + encodeURIComponent(S.proj) + '/board');
  const b = await r.json();
  if (my < applied) return; // a newer response already landed
  if (!r.ok) { toast(b.error || 'Project not found'); const other = S.projects.find(p => p.id !== S.proj); return other && switchProject(other.id); }
  applied = my; S.B = b;
  renderAll();
}

// ---------- Projects ----------
const projColor = id => { let h = 0; for (const c of id) h = (h * 31 + c.charCodeAt(0)) % 360; return `hsl(${h} 50% 50%)`; };
async function loadProjects() {
  const r = await (await fetch('/api/projects')).json();
  S.projects = r.projects || [];
}
let lpT; const loadProjectsSoon = () => { clearTimeout(lpT); lpT = setTimeout(loadProjects, 400); };
async function boot() {

      clearTimeout(pending.title?.t); delete pending.title;
      const v = title.orig; title.end(); t.value.title = e.target.value = v; grow(e.target);
      api('update_task', { id: t.value.id, title: v }).catch(() => {}); e.target.blur();
    }
    async function editDesc() {
      desc.start(t.value.description); editingDesc.value = true; await Vue.nextTick();
      const d = descEl.value; if (d) { grow(d); d.focus(); d.setSelectionRange(d.value.length, d.value.length); }
    }
    function onDesc(e) {
      grow(e.target); desc.draft = e.target.value; const id = t.value.id, v = desc.draft;
      later('desc', () => api('update_task', { id, description: v }).then(load).catch(() => {}), 700);
    }
    function finishDesc() {
      if (t.value && desc.draft != null) t.value.description = desc.draft; // show it until the reload lands
      flush('desc'); desc.end(); editingDesc.value = false;
    }
    const onDescClick = e => { if (!e.target.closest('a, input, .mermaid, .svgview, svg')) editDesc(); };
    // Ctrl/⌘+Enter anywhere in the drawer (except the comment box): save and close
    function onKey(e) {
      // Esc in a field without its own handler (selects, due date, toggles): leave the field, keep the drawer open
      if (e.key === 'Escape' && e.target.matches('input, select, textarea')) { e.stopPropagation(); return e.target.blur(); }
      if (!(e.ctrlKey || e.metaKey) || e.key !== 'Enter') return;
      e.preventDefault(); e.stopPropagation(); flush('title'); flush('desc'); e.target.blur?.(); closeTask();
    }
    const toggleCheck = (i, v) => { const ck = structuredClone(Vue.toRaw(t.value.checklist)); ck[i].done = v; patch({ checklist: ck }); };
    const removeCheck = i => patch({ checklist: t.value.checklist.filter((_, j) => j !== i) });
    async function addCheck() { const v = ckText.value.trim(); if (!v) return; ckText.value = ''; await patch({ checklist: [...t.value.checklist, { text: v, done: false }] }); }
    async function addLabel() {
      const v = labelText.value.trim(); if (!v) return;
      if (!labelColor(v)) { // new label: add it to the board first
        if (!confirm(`Create new label “${v}”?`)) return;
        await api('save_labels', [...S.B.labels, { name: v, color: randColor() }]).catch(() => {});
      }
      labelText.value = '';
      if (!t.value.labels.includes(v)) await patch({ labels: [...t.value.labels, v] });
    }
    async function sendComment() {
      const v = cmText.value.trim(); if (!v) return;
      await api('add_comment', { id: t.value.id, text: v }).then(() => { cmText.value = ''; }).catch(() => {});
      load();
    }
    const move = col => api('move_task', { id: t.value.id, column: col }).then(load).catch(() => load());
    const setHuman = v => api('set_human', { id: t.value.id, human: v }).then(load).catch(() => load());
    async function copyLink() {
      await navigator.clipboard?.writeText(location.origin + location.pathname + '#' + encodeURIComponent(S.proj) + '/' + encodeURIComponent(t.value.id)).catch(() => {});
      copied.value = true; setTimeout(() => copied.value = false, 1200);
    }
    function toggleWide() {
      if (drawer.style.width === '100vw') drawer.style.width = drawer.dataset.prev || '';
      else { drawer.dataset.prev = drawer.style.width; drawer.style.width = '100vw'; }
    }
    async function deleteTask() {
      if (!confirm(`Delete ${t.value.id}? This cannot be undone.`)) return;
      const id = t.value.id; closeTask();
      await api('delete_task', { id }).catch(() => {}); load();
    }
    return { S, member, labelColor, t, title, desc, editingDesc, ckText, cmText, labelText, copied, titleEl, descEl, done, freeLabels,
      ago, av, colName, closeTask, patch, onTitle, endTitle, cancelTitle, editDesc, onDesc, finishDesc, onDescClick, onKey,
      toggleCheck, removeCheck, addCheck, addLabel, sendComment, move, setHuman, copyLink, toggleWide, deleteTask };
  },
}).mount('#dApp');

// ---------- Appearance (per browser) ----------
function setTheme(v) {
  const r = document.documentElement;
  v === 'system' || !v ? delete r.dataset.theme : r.dataset.theme = v;
  store.set('kanban:theme', v === 'system' ? null : v);
  rethemeMd();
}
function setAccent(c) {
  const s = document.documentElement.style;
  if (c) { s.setProperty('--accent', c); s.setProperty('--accent-soft', `color-mix(in srgb, ${c} 18%, transparent)`); }
  else { s.removeProperty('--accent'); s.removeProperty('--accent-soft'); }
  store.set('kanban:accent', c);
}
setTheme(store.get('kanban:theme') || 'system');
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (!document.documentElement.dataset.theme) rethemeMd(); });
setAccent(store.get('kanban:accent'));

// ---------- Settings ----------
const settingsEl = $('#settings');
function openSettings() { if (S.openId) closeTask(); S.settingsN++; settingsEl.classList.add('open'); $('#scrim').classList.add('show'); }
function closeSettings() { if (!settingsEl.classList.contains('open')) return; Object.keys(pending).forEach(flush); settingsEl.classList.remove('open'); $('#scrim').classList.remove('show'); }
$('#settingsBtn').onclick = openSettings;

const clone = x => JSON.parse(JSON.stringify(x));
Vue.createApp({
  template: '#tpl-settings',
  setup() {
    const f = Vue.reactive({ settings: null, columns: [], members: [], labels: [] });
    const sync = () => Object.assign(f, clone({ settings: S.B.settings, columns: S.B.columns, members: S.B.members, labels: S.B.labels }));
    const quiet = () => !typingIn(settingsEl) && !Object.keys(pending).length;
    Vue.watch(() => S.settingsN, sync);                                                // opened
    Vue.watch(() => S.B, () => settingsEl.classList.contains('open') && quiet() && sync()); // live update
    const refresh = async () => { await load(); sync(); };
    const NAV = [['s-general', 'General'], ['s-columns', 'Columns'], ['s-appearance', 'Appearance'], ['s-labels', 'Labels'],
      ['s-members', 'Members & agents'], ['s-mcp', 'MCP & skill'], ['s-data', 'Data']];
    const navOn = Vue.ref('s-general'), mainEl = Vue.ref(null), copied = Vue.ref(-1), newLabel = Vue.ref(''), newMember = Vue.ref('');
    const theme = Vue.ref(store.get('kanban:theme') || 'system'), accent = Vue.ref(store.get('kanban:accent'));
    const go = id => { navOn.value = id; mainEl.value?.querySelector('#' + id)?.scrollIntoView({ behavior: 'smooth' }); };
    const counts = Vue.computed(() => { const n = {}; for (const t of S.B.tasks) n[t.column] = (n[t.column] || 0) + 1; return n; });
    const count = id => counts.value[id] || 0;
    const nextId = Vue.computed(() => `${(f.settings.prefix || 'KB').toUpperCase()}-${Math.max(0, ...S.B.tasks.map(t => +t.id.split('-').pop() || 0)) + 1}`);
    const snippets = Vue.computed(() => [
      ['Claude Code (run inside the repo)', `claude mcp add --transport http kanban "${location.origin}/mcp?agent=claude&project=${S.proj}"`],
      ['Codex: ~/.codex/config.toml', `[mcp_servers.kanban]\nurl = "${location.origin}/mcp?agent=codex&project=${S.proj}"`],
      ['Any other agent (pi, opencode, …)', `${location.origin}/mcp?agent=<name>&project=${S.proj}`],
      ['Sync the kanban skill (teaches agents the workflow)', 'agent-kanban skill sync'],
    ]);
    const saveSettings = () => later('settings', () => api('save_settings', clone(f.settings)).then(load).catch(load));
    const saveCols = () => later('cols', () => api('save_columns', clone(f.columns)).then(load).catch(load));
    const saveMembers = () => later('members', () => api('save_members', clone(f.members)).then(load).catch(load));
    const saveLabels = () => later('labels', () => api('save_labels', clone(f.labels)).then(load).catch(load));
    const setHeader = () => $('#boardName').textContent = f.settings.board;
    const act = async fn => { try { await fn(); } catch { /* toast already shown */ } await refresh(); };
    const moveCol = (i, d) => act(() => { const c = clone(f.columns); [c[i], c[i + d]] = [c[i + d], c[i]]; return api('save_columns', c); });
    const delCol = i => act(() => api('save_columns', clone(f.columns).filter((_, j) => j !== i)));
    async function addCol() {
      await act(() => api('save_columns', [...clone(f.columns), { id: 'c' + Date.now().toString(36), name: 'New column', color: '#7f848e' }]));
      await Vue.nextTick(); mainEl.value?.querySelector('#s-columns .row-i:last-child .grow')?.select();
    }
    const renameLabel = (from, to) => { to = to.trim(); return to && to !== from ? act(() => api('rename_label', { from, to })) : null; };
    function delLabel(i) {
      const l = f.labels[i];
      if (l.tasks && !confirm(`Remove “${l.name}” from ${l.tasks} task(s)?`)) return;
      act(() => api('save_labels', clone(f.labels).filter((_, j) => j !== i)));
    }
    async function addLabel() {
      const v = newLabel.value.trim(); if (!v) return;
      if (labelColor(v)) return toast(`Label “${v}” already exists`);
      newLabel.value = ''; await act(() => api('save_labels', [...clone(f.labels), { name: v, color: randColor() }]));
    }
    function delMember(i) {
      if (!confirm(`Remove ${f.members[i].name}? Their tasks become unassigned.`)) return;
      act(() => api('save_members', clone(f.members).filter((_, j) => j !== i)));
    }
    async function addMember() {
      const name = newMember.value.trim().toLowerCase().replace(/[^a-z0-9_-]+/g, '-').replace(/^[-_]+|[-_]+$/g, '').slice(0, 32);
      if (!name || member(name)) return toast(name ? `${name} already exists` : 'Invalid name');
      newMember.value = ''; await act(() => api('save_members', [...clone(f.members), { name, color: randColor(), agent: false }]));
    }
    async function copy(code, i) { await navigator.clipboard?.writeText(code).catch(() => {}); copied.value = i; setTimeout(() => copied.value = -1, 1500); }
    async function importFile(e) {
      const file = e.target.files[0]; e.target.value = ''; if (!file) return;
      try {
        const data = JSON.parse(await file.text());
        if (!confirm(`Replace the whole board with ${data.tasks?.length ?? 0} imported tasks?`)) return;
        await act(() => api('import', data));
      } catch (err) { toast('Import failed: ' + err.message); }
    }
    function deleteAll() { if (confirm(`Delete all ${S.B.tasks.length} tasks? This cannot be undone.`)) act(() => api('delete_all_tasks')); }
    return { S, f, NAV, navOn, mainEl, copied, newLabel, newMember, theme, accent, nextId, snippets,
      ARCHIVE: [[0, 'Never'], [7, 'After 7 days'], [14, 'After 14 days'], [30, 'After 30 days']],
      THEMES: [['system', '◐ System'], ['light', '☀ Light'], ['dark', '☾ Dark']], ACCENTS, PERMS, GLYPH,
      av, ago, iconOf, ME, count, go, closeSettings, setTheme, setAccent, deleteProject, setHeader,
      saveSettings, saveCols, saveMembers, saveLabels, moveCol, delCol, addCol, renameLabel, delLabel, addLabel,
      delMember, addMember, copy, importFile, deleteAll };
  },
}).mount('#setApp');

// ---------- Controls ----------
document.addEventListener('click', e => {
  const c = e.target.closest('.card'); if (c) return openTask(c.dataset.id);
  const f = e.target.closest('[data-open]'); if (f) openTask(f.dataset.open);
});
$('#scrim').onclick = () => { closeTask(); closeSettings(); };
$('#new').onclick = async e => {
  e.stopPropagation();
  const t = await api('create_task', { title: 'Untitled task' }).catch(() => null); if (!t) return;
  await load(); openTask(t.id); await Vue.nextTick(); $('.d-title')?.select();
};
['q', 'sort', 'who'].forEach(k => $('#' + k).addEventListener('input', e => S[k] = e.target.value));
$('#rSearch').onclick = () => openPalette();
$('#rNew').onclick = e => $('#new').onclick(e);
const setPanel = on => { $('main').classList.toggle('noside', !on); $('#rPanel').classList.toggle('on', on); store.set('kanban:panel', on ? null : 'off'); };
$('#rPanel').onclick = () => setPanel($('main').classList.contains('noside'));
setPanel(store.get('kanban:panel') !== 'off');
$('#q').addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); e.target.blur(); }                       // keep the filter
  if (e.key === 'Escape') { e.stopPropagation(); e.target.value = S.q = ''; e.target.blur(); } // clear it
});
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); return pal.classList.contains('open') ? closePalette() : openPalette(); }
  if (e.key === 'Escape' && pal.classList.contains('open')) return closePalette();
  if (e.key === 'Escape' && projPanel.classList.contains('open')) return toggleProjects(false);
  if (e.key === 'Escape' && S.openId) return closeTask();
  if (e.key === 'Escape') return closeSettings();
  if (e.target.matches('input, textarea, select') || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'Enter' && e.target.matches('.card')) openTask(e.target.dataset.id);
  if (e.key === '/') { e.preventDefault(); openPalette(); }
  if (e.key === 'f') { e.preventDefault(); $('#q').focus(); $('#q').select(); }
  if (e.key === 'p') { e.preventDefault(); toggleProjects(); }
  if (e.key === 'n') { e.preventDefault(); $('#new').click(); }
  if (e.key === ',') { e.preventDefault(); openSettings(); }
});

connect();
</script>
</body>
</html>
